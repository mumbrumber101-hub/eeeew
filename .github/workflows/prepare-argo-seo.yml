name: Prepare approved Argo SEO repair
on:
  push:
    branches: [seo-prepare-argo-20261112]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact validated patch
        env:
          EXPECTED_HEAD: 956e180ad8fbe0d655e2a8edf12726f8f1273d1f
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PYTHON'
          import base64,hashlib,subprocess,zlib
          from pathlib import Path
          p=Path('index.html')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '842fc44fe367c2be91551b4c1d2b7366e0058f7bd6360260359bf611b3abb4fa'
          patch=zlib.decompress(base64.b64decode(''))
          subprocess.run(['git','apply','-'],input=patch,check=True)
          generator=Path('/tmp/argo_generate.cjs')
          generator.write_bytes(zlib.decompress(base64.b64decode('')))
          subprocess.run(['node',str(generator),'index.html'],check=True)
          s=p.read_text().replace('https://www.arriveateasterwine.com/argo-glossary','https://mumbrumber101-hub.github.io/eeeew/')
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '24899743b352a414fdca8af64e80374e826a99e6174659734ebc810877c4a0b7'
          print('Verified 3764 definitions and citations; existing source data preserved')
          PYTHON
          test "$(git diff --name-only)" = "index.html"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expose Argo glossary definitions in initial HTML and add SEO metadata"
          git push origin HEAD:refs/heads/seo-candidate-argo-20261112
          git rev-parse HEAD
